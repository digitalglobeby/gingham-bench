# Gingham Bench for iPhone and iPad: the same live rows in Gingham,
# UITableView and UICollectionView (typical and tuned), SwiftUI Table and
# SwiftUI List, scrolled (steady, fast, flicks) while values change; frames
# measured by the app, by UI tests (XCTOSSignpostMetric) and by Instruments.
# Made with XcodeGen: run `xcodegen` in this folder after changing this file
# or adding files (GinghamBench.xcodeproj is generated from it).
name: GinghamBench
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Xcode 26.0 and later.
  xcodeVersion: "26.0"
packages:
  # Only the public binary package: what any app links.
  Gingham:
    url: https://github.com/digitalglobeby/Gingham
    from: 1.1.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CX4XTQ23ND
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
targets:
  Gingham Bench:
    type: application
    platform: iOS
    sources:
      - GinghamBench
      # The bench's license key (every row shown; see the file).
      - path: ../Shared/BenchKey.swift
        group: Shared
    dependencies:
      - package: Gingham
        product: Gingham
    info:
      path: GinghamBench/Info.plist
      properties:
        CFBundleDisplayName: Gingham Bench
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Without it iPhones cap a third-party app's frames at 60 a second,
        # also on 120 Hz (ProMotion) screens.
        CADisableMinimumFrameDurationOnPhone: true
        # Seven columns fit an iPhone's width only in landscape (and SwiftUI's
        # Table shows all its columns only in a regular width).
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Results are written to Documents (devicectl copies them from the
        # app's container; the Files app shows them too).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The bench repository's commit, set by Scripts/run-device.sh (empty from Xcode).
        GinghamBenchCommit: $(BENCH_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.digitalglobe.gingham-bench
        PRODUCT_NAME: GinghamBench
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Gingham's binary is for Apple silicon only (its simulator slice too).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        BENCH_COMMIT: ""
        # Like a new Xcode 26 project: main actor by default (Shared/BenchKey.swift
        # calls the main actor's GHLicense.register).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  # Real flicks measured by the system (XCTOSSignpostMetric), see UITests/.
  Gingham Bench UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Gingham Bench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.digitalglobe.gingham-bench.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Gingham Bench
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Gingham Bench:
    build:
      targets:
        Gingham Bench: all
        Gingham Bench UITests: [test]
    run:
      # Frames are compared in an optimized build, without the debugger
      # attached (Scripts/run-device.sh runs it the same way).
      config: Release
      debugEnabled: false
    test:
      # The app under test optimized, as measured.
      config: Release
      targets: [Gingham Bench UITests]
    profile:
      config: Release
    archive:
      config: Release
